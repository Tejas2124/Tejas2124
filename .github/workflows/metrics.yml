name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: tejasraval
          template: classic
          theme: dark

          # === ACTIVITY OVERVIEW TILE ===
          activity: yes
          activity.limit: 0
          activity.days: 14
          activity.filter: all

          # === COMMUNITY (issues / PRs / reviews) ===
          community: yes
          community.limit: 0

          # === REPOSITORIES SUMMARY ===
          repositories: yes
          repositories.batch: 100
          repositories.forks: no
          repositories.affiliations: owner,collaborator

          # === CLEAN LOOK ===
          metadata: no
